[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
gas_limit = "300000000"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read-write", path = "./deployments" },
  # 餘額樹的跨語言一致性 fixture，由 web/scripts/gen-tree-fixture.mjs 產生
  { access = "read", path = "./test/fixtures" },
]

# v4-core 的 PoolManager 需要 via_ir 才能通過合約大小限制；
# 測試以 --code-size-limit 放寬，正式部署改用 profile.production。
[profile.production]
via_ir = true
optimizer_runs = 44444444

# 目標鏈比 Cancun 舊（缺 EIP-1153 TSTORE / EIP-5656 MCOPY）時使用，例如 iSunCoin（geth 1.12.x）。
# v4 的編譯期相依已經拆乾淨（Deploy / DemoFlow / Fixture 都不 import v4），所以這裡只要 skip 掉
# 對 v4 有相依的那幾個檔案。
#
# ⚠️ 還差一步 —— 已實測到的狀況：
#   via_ir = false → Listing / CarbonPool / CarbonRegistry / CarbonCredit1155 /
#                    RetirementCertificate 五個合約全部 "Stack too deep"。沒有 MCOPY 時
#                    solc 產出的記憶體搬移碼比較吃堆疊，這是系統性的，不是某個函式區域變數太多。
#   via_ir = true  → 上面五個全過（實測 Compiler run successful），只剩 Safe v1.4.1 的
#                    execTransaction 編不過（Safe 的 inline assembly 沒標 memory-safe，
#                    是 Safe 已知的 via_ir 問題）。
#
# 所以唯一的阻塞點是 Safe。解法：不要編譯 Safe，改用 Safe v1.4.1 的 canonical creation
# bytecode 直接 CREATE（Safe v1.4.1 官方是 solc 0.7.6 編的，本來就不含 Cancun 指令）。
# 附帶好處：部署出來的 Safe 與已稽核的 canonical 版本位元組完全一致，而不是我們自己重編的版本。
[profile.shanghai]
evm_version = "shanghai"
via_ir = true
skip = [
  "src/v4/**",
  "script/DeployV4.s.sol",
  "script/DemoFlowV4.s.sol",
  "test/V4.t.sol",
  "test/utils/V4Fixture.sol",
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
anvil = "http://127.0.0.1:28545"
# 公開測試鏈：Base Sepolia（chainId 84532）。Cancun 齊備，2 秒出塊，gas 幾乎免費。
# 自己的 RPC 供應商端點放 BASE_SEPOLIA_RPC_URL；不設就走公共端點（有速率限制，
# 回填模擬資料時務必換成自己的，否則會被限流打斷）。
base_sepolia = "${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}"
# 任何其他鏈：export RPC_URL=… 後用 --rpc-url chain
chain = "${RPC_URL}"

# 合約原始碼驗證。公開鏈上這一步不是裝飾——國家單位要能自己比對
# 「鏈上跑的位元組碼」和「repo 裡的原始碼」是同一份，否則治理揭露沒有意義。
#   forge script … --broadcast --verify
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
