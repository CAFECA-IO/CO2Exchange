[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
gas_limit = "300000000"
fs_permissions = [{ access = "read", path = "./out" }]

# v4-core 的 PoolManager 需要 via_ir 才能通過合約大小限制；
# 測試以 --code-size-limit 放寬，正式部署改用 profile.production。
[profile.production]
via_ir = true
optimizer_runs = 44444444

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
